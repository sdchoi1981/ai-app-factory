plugins { id 'com.android.application' }
android {
    namespace 'factory.kit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.factory.photokit'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '1.1.0'
    }
    sourceSets { main { java.srcDirs += ['../../../packages/ui/android/java']; res.srcDirs += ['../../../packages/ui/android/res'] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
