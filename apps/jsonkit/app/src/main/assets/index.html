<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JsonKit</title><style>:root{color-scheme:light dark;--accent:#3a586d;font:16px system-ui}*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172838}main{max-width:640px;margin:auto;padding:20px 18px 36px}header{padding:10px 0 18px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:18px;font-weight:500;margin:8px 0;color:#516477}.panel{background:white;padding:18px;border:1px solid #d9e1e8;border-radius:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c3ce;background:white;color:#172838;padding:12px;border-radius:10px;min-height:48px}textarea{resize:vertical}button{font:600 15px system-ui;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:white;padding:10px;flex:1 1 40%}#actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.toolbar button{background:transparent;color:inherit;border:1px solid #9ba9b6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:500 18px/1.6 system-ui;min-height:50px;margin:0;user-select:text}p{line-height:1.5;font-size:14px;color:#516477}@media(prefers-color-scheme:dark){body{background:#101a28;color:#eef3f8}.panel,input,textarea,select{background:#1d2b3b;color:#eef3f8;border-color:#526173}h2,p{color:#b9c7d5}}</style></head><body><main><header><h1>JsonKit</h1><h2 id="title"></h2></header><section class="panel"><div id="fields"></div><div id="actions"></div></section><section class="panel"><pre id="result" role="status" aria-live="polite" tabindex="0"></pre><div class="toolbar"><button id="copy"></button><button id="reset"></button></div></section><p id="note"></p></main><script id="engine">const ZONES=["UTC","Asia/Seoul","Asia/Tokyo","Asia/Shanghai","Asia/Singapore","Asia/Kolkata","Asia/Dubai","Europe/London","Europe/Paris","America/New_York","America/Chicago","America/Los_Angeles","Australia/Sydney","Pacific/Auckland"];
function num(v){if(typeof v!=='string'||!v.trim()||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?$/.test(v.trim()))throw Error('number');return finite(Number(v))}
function finite(n){if(!Number.isFinite(n))throw Error('range');return n}
function calculate(v,op){if(typeof v.text!=='string'||v.text.length>250000)throw Error('range');const value=JSON.parse(v.text);if(op==='validate')return 'Valid JSON';if(op==='min')return JSON.stringify(value);if(op==='pretty')return JSON.stringify(value,null,2);throw Error('operation')}</script><script>const config={"fields":[["text","JSON 입력","JSON input","textarea","{\"name\":\"JsonKit\",\"items\":[1,2,3]}"]],"actions":[["pretty","보기 좋게","Pretty print"],["min","압축","Minify"],["validate","유효성 검사","Validate"]],"title":["JSON 포맷 · 검증","JSON formatter and validator"],"note":["표준 JavaScript JSON 파서를 사용합니다. 큰 정수 정밀도와 중복 키를 보존하지 않으므로 원본은 별도로 보관하세요.","Uses standard JavaScript JSON parsing. Large integers and duplicate keys may not be preserved; retain the original."],"labels":{}};const ko=(navigator.language||'').startsWith('ko');document.documentElement.lang=ko?'ko':'en';const L=(a,b)=>ko?a:b;document.getElementById('title').textContent=config.title[ko?0:1];document.getElementById('note').textContent=config.note[ko?0:1];const inputs={};const fields=document.getElementById('fields');for(const [id,k,e,type,value] of config.fields){const label=document.createElement('label');label.textContent=L(k,e);let el;if(type==='textarea'){el=document.createElement('textarea');el.rows=6;el.maxLength=250000;el.spellcheck=false;}else if(type==='zone'){el=document.createElement('select');for(const z of ZONES){const o=document.createElement('option');o.value=o.textContent=z;el.append(o)}}else{el=document.createElement('input');el.type=type==='number'?'text':type;if(type==='number')el.inputMode='decimal';}el.id=id;el.value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;label.htmlFor=id;fields.append(label,el);inputs[id]=el;}const out=document.getElementById('result');const buttons=document.getElementById('actions');const fmt=n=>new Intl.NumberFormat(ko?'ko-KR':'en-US',{maximumSignificantDigits:12}).format(n);function show(x){if(x!==null&&typeof x==='object')out.textContent=Object.entries(x).map(([k,v])=>(config.labels[k]?.[ko?0:1]||k)+': '+(typeof v==='number'?fmt(v):v)).join('\n');else out.textContent=typeof x==='number'?fmt(x):x==='Valid JSON'?L('유효한 JSON','Valid JSON'):String(x)}for(const [id,k,e] of config.actions){const b=document.createElement('button');b.type='button';b.textContent=L(k,e);b.addEventListener('click',()=>{try{show(calculate(Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])),id));}catch(err){out.textContent=L('입력값을 확인하세요. 계산 또는 처리할 수 없습니다.','Check input. Unable to calculate or process.');}});buttons.append(b)}document.getElementById('reset').textContent=L('초기화','Reset');document.getElementById('reset').addEventListener('click',()=>{for(const [id,k,e,type,value] of config.fields)inputs[id].value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;out.textContent='';});document.getElementById('copy').textContent=L('결과 복사','Copy result');document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.textContent);}catch{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}});</script></body></html>
