plugins { id 'com.android.application' }

android {
    namespace 'com.factory.jsonkit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.factory.jsonkit'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += ['../../../packages/core/android/java', '../../../packages/ui/android/java']
            res.srcDirs += ['../../../packages/ui/android/res']
        }
    }
}
