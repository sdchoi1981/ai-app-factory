<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LoanKit</title><style>:root{color-scheme:light dark;--accent:#315b96;font:16px system-ui}*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172838}main{max-width:640px;margin:auto;padding:20px 18px 36px}header{padding:10px 0 18px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:18px;font-weight:500;margin:8px 0;color:#516477}.panel{background:white;padding:18px;border:1px solid #d9e1e8;border-radius:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c3ce;background:white;color:#172838;padding:12px;border-radius:10px;min-height:48px}textarea{resize:vertical}button{font:600 15px system-ui;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:white;padding:10px;flex:1 1 40%}#actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.toolbar button{background:transparent;color:inherit;border:1px solid #9ba9b6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:500 18px/1.6 system-ui;min-height:50px;margin:0;user-select:text}p{line-height:1.5;font-size:14px;color:#516477}@media(prefers-color-scheme:dark){body{background:#101a28;color:#eef3f8}.panel,input,textarea,select{background:#1d2b3b;color:#eef3f8;border-color:#526173}h2,p{color:#b9c7d5}}</style></head><body><main><header><h1>LoanKit</h1><h2 id="title"></h2></header><section class="panel"><div id="fields"></div><div id="actions"></div></section><section class="panel"><pre id="result" role="status" aria-live="polite" tabindex="0"></pre><div class="toolbar"><button id="copy"></button><button id="reset"></button></div></section><p id="note"></p></main><script id="engine">const ZONES=["UTC","Asia/Seoul","Asia/Tokyo","Asia/Shanghai","Asia/Singapore","Asia/Kolkata","Asia/Dubai","Europe/London","Europe/Paris","America/New_York","America/Chicago","America/Los_Angeles","Australia/Sydney","Pacific/Auckland"];
function num(v){if(typeof v!=='string'||!v.trim()||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?$/.test(v.trim()))throw Error('number');return finite(Number(v))}
function finite(n){if(!Number.isFinite(n))throw Error('range');return n}
function calculate(v,op){const p=num(v.principal),r=num(v.rate)/1200,n=num(v.months);if(p<=0||p>1e15||r<0||r>1||!Number.isInteger(n)||n<1||n>1200)throw Error('range');let first,last,interest,total;if(op==='payment'){first=last=r===0?p/n:p*r/(-Math.expm1(-n*Math.log1p(r)));total=first*n;interest=Math.max(0,total-p)}else if(op==='principal'){first=p/n+p*r;last=p/n+p/n*r;interest=p*r*(n+1)/2;total=p+interest}else if(op==='interest'){first=n===1?p+p*r:p*r;last=p+p*r;interest=p*r*n;total=p+interest}else throw Error('operation');return {first:finite(first),last:finite(last),interest:finite(interest),total:finite(total)}}</script><script>const config={"fields":[["principal","대출 원금","Principal","number","10000000"],["rate","연이율 (%)","Annual rate (%)","number","5"],["months","기간 (개월)","Term (months)","number","36"]],"actions":[["payment","원리금 균등","Equal payment"],["principal","원금 균등","Equal principal"],["interest","만기 일시상환","Interest only"]],"title":["대출 이자 계산기","Loan repayment calculator"],"note":["단순 월 단위 추정치입니다. 수수료, 일할 이자, 중도상환 및 실제 금융기관 조건은 반영하지 않습니다.","Monthly estimates only; fees, daily accrual, prepayment and lender terms are excluded."],"labels":{"first":["첫 달 상환액","First payment"],"last":["마지막 달 상환액","Last payment"],"interest":["총 이자","Total interest"],"total":["총 상환액","Total repayment"]}};const ko=(navigator.language||'').startsWith('ko');document.documentElement.lang=ko?'ko':'en';const L=(a,b)=>ko?a:b;document.getElementById('title').textContent=config.title[ko?0:1];document.getElementById('note').textContent=config.note[ko?0:1];const inputs={};const fields=document.getElementById('fields');for(const [id,k,e,type,value] of config.fields){const label=document.createElement('label');label.textContent=L(k,e);let el;if(type==='textarea'){el=document.createElement('textarea');el.rows=6;el.maxLength=250000;el.spellcheck=false;}else if(type==='zone'){el=document.createElement('select');for(const z of ZONES){const o=document.createElement('option');o.value=o.textContent=z;el.append(o)}}else{el=document.createElement('input');el.type=type==='number'?'text':type;if(type==='number')el.inputMode='decimal';}el.id=id;el.value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;label.htmlFor=id;fields.append(label,el);inputs[id]=el;}const out=document.getElementById('result');const buttons=document.getElementById('actions');const fmt=n=>new Intl.NumberFormat(ko?'ko-KR':'en-US',{maximumSignificantDigits:12}).format(n);function show(x){if(x!==null&&typeof x==='object')out.textContent=Object.entries(x).map(([k,v])=>(config.labels[k]?.[ko?0:1]||k)+': '+(typeof v==='number'?fmt(v):v)).join('\n');else out.textContent=typeof x==='number'?fmt(x):x==='Valid JSON'?L('유효한 JSON','Valid JSON'):String(x)}for(const [id,k,e] of config.actions){const b=document.createElement('button');b.type='button';b.textContent=L(k,e);b.addEventListener('click',()=>{try{show(calculate(Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])),id));}catch(err){out.textContent=L('입력값을 확인하세요. 계산 또는 처리할 수 없습니다.','Check input. Unable to calculate or process.');}});buttons.append(b)}document.getElementById('reset').textContent=L('초기화','Reset');document.getElementById('reset').addEventListener('click',()=>{for(const [id,k,e,type,value] of config.fields)inputs[id].value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;out.textContent='';});document.getElementById('copy').textContent=L('결과 복사','Copy result');document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.textContent);}catch{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}});</script></body></html>
