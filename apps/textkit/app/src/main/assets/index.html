<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TextKit</title><style>:root{color-scheme:light dark;--accent:#7c428a;font:16px system-ui}*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172838}main{max-width:640px;margin:auto;padding:20px 18px 36px}header{padding:10px 0 18px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:18px;font-weight:500;margin:8px 0;color:#516477}.panel{background:white;padding:18px;border:1px solid #d9e1e8;border-radius:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c3ce;background:white;color:#172838;padding:12px;border-radius:10px;min-height:48px}textarea{resize:vertical}button{font:600 15px system-ui;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:white;padding:10px;flex:1 1 40%}#actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.toolbar button{background:transparent;color:inherit;border:1px solid #9ba9b6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:500 18px/1.6 system-ui;min-height:50px;margin:0;user-select:text}p{line-height:1.5;font-size:14px;color:#516477}@media(prefers-color-scheme:dark){body{background:#101a28;color:#eef3f8}.panel,input,textarea,select{background:#1d2b3b;color:#eef3f8;border-color:#526173}h2,p{color:#b9c7d5}}</style></head><body><main><header><h1>TextKit</h1><h2 id="title"></h2></header><section class="panel"><div id="fields"></div><div id="actions"></div></section><section class="panel"><pre id="result" role="status" aria-live="polite" tabindex="0"></pre><div class="toolbar"><button id="copy"></button><button id="reset"></button></div></section><p id="note"></p></main><script id="engine">const ZONES=["UTC","Asia/Seoul","Asia/Tokyo","Asia/Shanghai","Asia/Singapore","Asia/Kolkata","Asia/Dubai","Europe/London","Europe/Paris","America/New_York","America/Chicago","America/Los_Angeles","Australia/Sydney","Pacific/Auckland"];
function num(v){if(typeof v!=='string'||!v.trim()||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?$/.test(v.trim()))throw Error('number');return finite(Number(v))}
function finite(n){if(!Number.isFinite(n))throw Error('range');return n}
function calculate(v,op){const s=v.text;if(typeof s!=='string'||s.length>250000)throw Error('range');if(op==='count')return {characters:[...s].length,nonspace:[...s.replace(/\s/gu,'')].length,words:s.trim()?s.trim().split(/\s+/u).length:0,lines:s?s.split(/\r\n|\n|\r/).length:0,bytes:new TextEncoder().encode(s).length};if(op==='upper')return s.toUpperCase();if(op==='lower')return s.toLowerCase();if(op==='trim')return s.split(/\r\n|\n|\r/).map(x=>x.trim().replace(/[^\S\r\n]+/g,' ')).join('\n').trim();if(op==='unique')return [...new Set(s.split(/\r\n|\n|\r/))].join('\n');throw Error('operation')}</script><script>const config={"fields":[["text","텍스트 입력","Text input","textarea","Hello 안녕하세요"]],"actions":[["count","글자 수","Count"],["upper","대문자","Uppercase"],["lower","소문자","Lowercase"],["trim","공백 정리","Clean spaces"],["unique","중복 줄 제거","Unique lines"]],"title":["글자 수 · 문자열 도구","Text tools and character counter"],"note":["문자 수는 유니코드 코드 포인트 기준, 단어 수는 공백 구분 기준입니다.","Characters are Unicode code points; words are whitespace-separated."],"labels":{"characters":["글자 수","Characters"],"nonspace":["공백 제외","Non-whitespace"],"words":["단어 수","Words"],"lines":["줄 수","Lines"],"bytes":["UTF-8 바이트","UTF-8 bytes"]}};const ko=(navigator.language||'').startsWith('ko');document.documentElement.lang=ko?'ko':'en';const L=(a,b)=>ko?a:b;document.getElementById('title').textContent=config.title[ko?0:1];document.getElementById('note').textContent=config.note[ko?0:1];const inputs={};const fields=document.getElementById('fields');for(const [id,k,e,type,value] of config.fields){const label=document.createElement('label');label.textContent=L(k,e);let el;if(type==='textarea'){el=document.createElement('textarea');el.rows=6;el.maxLength=250000;el.spellcheck=false;}else if(type==='zone'){el=document.createElement('select');for(const z of ZONES){const o=document.createElement('option');o.value=o.textContent=z;el.append(o)}}else{el=document.createElement('input');el.type=type==='number'?'text':type;if(type==='number')el.inputMode='decimal';}el.id=id;el.value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;label.htmlFor=id;fields.append(label,el);inputs[id]=el;}const out=document.getElementById('result');const buttons=document.getElementById('actions');const fmt=n=>new Intl.NumberFormat(ko?'ko-KR':'en-US',{maximumSignificantDigits:12}).format(n);function show(x){if(x!==null&&typeof x==='object')out.textContent=Object.entries(x).map(([k,v])=>(config.labels[k]?.[ko?0:1]||k)+': '+(typeof v==='number'?fmt(v):v)).join('\n');else out.textContent=typeof x==='number'?fmt(x):x==='Valid JSON'?L('유효한 JSON','Valid JSON'):String(x)}for(const [id,k,e] of config.actions){const b=document.createElement('button');b.type='button';b.textContent=L(k,e);b.addEventListener('click',()=>{try{show(calculate(Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])),id));}catch(err){out.textContent=L('입력값을 확인하세요. 계산 또는 처리할 수 없습니다.','Check input. Unable to calculate or process.');}});buttons.append(b)}document.getElementById('reset').textContent=L('초기화','Reset');document.getElementById('reset').addEventListener('click',()=>{for(const [id,k,e,type,value] of config.fields)inputs[id].value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;out.textContent='';});document.getElementById('copy').textContent=L('결과 복사','Copy result');document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.textContent);}catch{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}});</script></body></html>
