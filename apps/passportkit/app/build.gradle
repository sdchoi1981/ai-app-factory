plugins { id 'com.android.application' }
android {
    namespace 'com.factory.passportkit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.factory.passportkit'
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName '1.5.2'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += ['../../../packages/core/android/java', '../../../packages/ui/android/java']
            res.srcDirs += ['../../../packages/ui/android/res']
        }
    }
}
dependencies {
    // Align legacy transitive JDK7/JDK8 modules with the merged Kotlin stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.core:core:1.15.0'
    implementation 'com.google.mlkit:face-detection:16.1.7'
}
