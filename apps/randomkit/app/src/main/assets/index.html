<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RandomKit</title><style>:root{color-scheme:light dark;--accent:#29764d;font:16px system-ui}*{box-sizing:border-box}body{margin:0;background:#eef3f8;color:#172838}main{max-width:640px;margin:auto;padding:20px 18px 36px}header{padding:10px 0 18px}h1{font-size:32px;letter-spacing:-1px;margin:0}h2{font-size:18px;font-weight:500;margin:8px 0;color:#516477}.panel{background:white;padding:18px;border:1px solid #d9e1e8;border-radius:18px;margin-bottom:16px}label{display:block;font-weight:600;margin:12px 0 6px}input,textarea,select{width:100%;font:inherit;border:1px solid #b5c3ce;background:white;color:#172838;padding:12px;border-radius:10px;min-height:48px}textarea{resize:vertical}button{font:600 15px system-ui;min-height:48px;border-radius:12px;border:0;background:var(--accent);color:white;padding:10px;flex:1 1 40%}#actions,.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.toolbar button{background:transparent;color:inherit;border:1px solid #9ba9b6}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:500 18px/1.6 system-ui;min-height:50px;margin:0;user-select:text}p{line-height:1.5;font-size:14px;color:#516477}@media(prefers-color-scheme:dark){body{background:#101a28;color:#eef3f8}.panel,input,textarea,select{background:#1d2b3b;color:#eef3f8;border-color:#526173}h2,p{color:#b9c7d5}}</style></head><body><main><header><h1>RandomKit</h1><h2 id="title"></h2></header><section class="panel"><div id="fields"></div><div id="actions"></div></section><section class="panel"><pre id="result" role="status" aria-live="polite" tabindex="0"></pre><div class="toolbar"><button id="copy"></button><button id="reset"></button></div></section><p id="note"></p></main><script id="engine">const ZONES=["UTC","Asia/Seoul","Asia/Tokyo","Asia/Shanghai","Asia/Singapore","Asia/Kolkata","Asia/Dubai","Europe/London","Europe/Paris","America/New_York","America/Chicago","America/Los_Angeles","Australia/Sydney","Pacific/Auckland"];
function num(v){if(typeof v!=='string'||!v.trim()||!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][-+]?\d+)?$/.test(v.trim()))throw Error('number');return finite(Number(v))}
function finite(n){if(!Number.isFinite(n))throw Error('range');return n}
function rand(n){if(!Number.isSafeInteger(n)||n<1||n>4294967296)throw Error('range');const lim=Math.floor(4294967296/n)*n,a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=lim);return a[0]%n}function take(a,k){for(let i=0;i<k;i++){const j=i+rand(a.length-i);[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,k)}function calculate(v,op){if(op==='number'){const lo=num(v.min),hi=num(v.max),k=num(v.count),span=hi-lo+1;if(![lo,hi,k].every(Number.isSafeInteger)||span<1||span>100000||k<1||k>Math.min(span,1000))throw Error('range');return take(Array.from({length:span},(_,i)=>lo+i),k).join(', ')}if(typeof v.text!=='string'||v.text.length>100000)throw Error('range');const a=[...new Set(v.text.split(/\r\n|\n|\r/).map(x=>x.trim()).filter(Boolean))];const k=op==='shuffle'?a.length:num(v.count);if(!['shuffle','pick'].includes(op)||!Number.isInteger(k)||k<1||k>a.length||a.length>10000)throw Error('range');return take(a,k).join('\n')}</script><script>const config={"fields":[["min","최솟값","Minimum","number","1"],["max","최댓값","Maximum","number","45"],["count","추첨 수","Count","number","6"],["text","후보 목록 (한 줄에 하나)","Candidates (one per line)","textarea","A\nB\nC\nD\nE\nF"]],"actions":[["number","중복 없는 번호","Unique numbers"],["pick","후보 추첨","Pick candidates"],["shuffle","후보 섞기","Shuffle candidates"]],"title":["랜덤 추첨 · 번호 생성","Random picker and number generator"],"note":["기기의 난수 생성기를 사용합니다. 결과는 저장되지 않습니다.","Uses device randomness. Results are not stored."],"labels":{}};const ko=(navigator.language||'').startsWith('ko');document.documentElement.lang=ko?'ko':'en';const L=(a,b)=>ko?a:b;document.getElementById('title').textContent=config.title[ko?0:1];document.getElementById('note').textContent=config.note[ko?0:1];const inputs={};const fields=document.getElementById('fields');for(const [id,k,e,type,value] of config.fields){const label=document.createElement('label');label.textContent=L(k,e);let el;if(type==='textarea'){el=document.createElement('textarea');el.rows=6;el.maxLength=250000;el.spellcheck=false;}else if(type==='zone'){el=document.createElement('select');for(const z of ZONES){const o=document.createElement('option');o.value=o.textContent=z;el.append(o)}}else{el=document.createElement('input');el.type=type==='number'?'text':type;if(type==='number')el.inputMode='decimal';}el.id=id;el.value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;label.htmlFor=id;fields.append(label,el);inputs[id]=el;}const out=document.getElementById('result');const buttons=document.getElementById('actions');const fmt=n=>new Intl.NumberFormat(ko?'ko-KR':'en-US',{maximumSignificantDigits:12}).format(n);function show(x){if(x!==null&&typeof x==='object')out.textContent=Object.entries(x).map(([k,v])=>(config.labels[k]?.[ko?0:1]||k)+': '+(typeof v==='number'?fmt(v):v)).join('\n');else out.textContent=typeof x==='number'?fmt(x):x==='Valid JSON'?L('유효한 JSON','Valid JSON'):String(x)}for(const [id,k,e] of config.actions){const b=document.createElement('button');b.type='button';b.textContent=L(k,e);b.addEventListener('click',()=>{try{show(calculate(Object.fromEntries(Object.entries(inputs).map(([k,v])=>[k,v.value])),id));}catch(err){out.textContent=L('입력값을 확인하세요. 계산 또는 처리할 수 없습니다.','Check input. Unable to calculate or process.');}});buttons.append(b)}document.getElementById('reset').textContent=L('초기화','Reset');document.getElementById('reset').addEventListener('click',()=>{for(const [id,k,e,type,value] of config.fields)inputs[id].value=type==='datetime-local'&&!value?new Date().toISOString().slice(0,16):value;out.textContent='';});document.getElementById('copy').textContent=L('결과 복사','Copy result');document.getElementById('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(out.textContent);}catch{const r=document.createRange();r.selectNodeContents(out);const s=getSelection();s.removeAllRanges();s.addRange(r);}});</script></body></html>
