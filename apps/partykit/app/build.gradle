plugins { id 'com.android.application' }
android {
    namespace 'factory.fun'
    compileSdk 36
    defaultConfig {
        applicationId 'com.factory.partykit'
        minSdk 30
        targetSdk 36
        versionCode 2
        versionName '2.0.0'
    }
    sourceSets {
        main {
            java.srcDirs += '../../../packages/ui/android/java'
            res.srcDirs += '../../../packages/ui/android/res'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
