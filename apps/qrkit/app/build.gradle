plugins { id 'com.android.application' }

android {
    namespace 'com.factory.qrkit'
    compileSdk 36
    defaultConfig {
        applicationId 'com.factory.qrkit'
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets {
        main {
            java.srcDirs += ['../../../packages/core/android/java', '../../../packages/ui/android/java']
            res.srcDirs += ['../../../packages/ui/android/res']
        }
    }
}

dependencies {
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.zxing:core:3.5.4'
}
