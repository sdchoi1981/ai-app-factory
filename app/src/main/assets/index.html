<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnitKit</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#14243a;font:16px system-ui}body.dark{background:#0b1424;color:#eef5ff}main{max-width:620px;margin:auto;padding:20px}header{display:flex;align-items:center;gap:10px}h1{flex:1}button,select,input{font:inherit;color:inherit;background:transparent;border:1px solid #94a3b8;border-radius:10px;padding:12px}button{cursor:pointer}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:16px 0}.active{background:#175cdb;color:white}.card{border:1px solid #94a3b8;border-radius:18px;padding:18px;display:grid;gap:12px}input,select{width:100%}input{font-size:28px}output{font-size:32px;font-weight:bold;overflow-wrap:anywhere;color:#397ce7}.line{display:flex;justify-content:space-between;gap:10px;padding:12px;border-bottom:1px solid #94a3b8}small{opacity:.8}footer{text-align:center;padding:20px}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #397ce7}</style><main><header><h1>UnitKit</h1><button id="lang">EN</button><button id="theme" aria-label="Theme">◐</button></header><div id="cats" class="cats"></div><section class="card"><label id="fl" for="from">변환할 단위</label><select id="from"></select><input id="amount" inputmode="decimal" value="1" aria-label="Value"><button id="swap" aria-label="Swap units">⇅</button><label id="tl" for="to">결과 단위</label><select id="to"></select><output id="result" aria-live="polite"></output><button id="copy">복사</button><small id="status" role="status"></small></section><h2 id="al">전체 단위 변환</h2><div id="all"></div><footer id="footer"></footer></main><script>
const data={
length:['길이','Length',[['m',1],['km',1000],['cm',.01],['mm',.001],['μm',1e-6],['in',.0254],['ft',.3048],['yd',.9144],['mi',1609.344],['nmi',1852]]],
mass:['무게','Mass',[['kg',1],['g',.001],['mg',1e-6],['t',1000],['lb',.45359237],['oz',.028349523125],['st',6.35029318]]],
temp:['온도','Temperature',[['°C',1],['°F',1],['K',1]]],
area:['면적','Area',[['m²',1],['평',400/121],['km²',1e6],['cm²',.0001],['ha',10000],['ac',4046.8564224],['ft²',.09290304],['in²',.00064516]]],
volume:['부피','Volume',[['L',1],['mL',.001],['m³',1000],['cm³',.001],['gal US',3.785411784],['gal UK',4.54609],['cup US',.2365882365],['fl oz US',.0295735295625],['tbsp US',.01478676478125],['tsp US',.00492892159375]]],
speed:['속도','Speed',[['km/h',1/3.6],['m/s',1],['mph',.44704],['kn',1852/3600],['ft/s',.3048]]],
time:['시간','Time',[['s',1],['ms',.001],['min',60],['h',3600],['d',86400],['wk',604800]]],
data:['데이터','Data',[['B',1],['bit',.125],['KB',1e3],['MB',1e6],['GB',1e9],['TB',1e12],['KiB',1024],['MiB',1048576],['GiB',1073741824]]],
pressure:['압력','Pressure',[['Pa',1],['kPa',1000],['MPa',1e6],['bar',1e5],['atm',101325],['psi',6894.757293168],['mmHg',133.322387415]]],
energy:['에너지','Energy',[['J',1],['kJ',1000],['cal',4.184],['kcal',4184],['Wh',3600],['kWh',3600000]]],
angle:['각도','Angle',[['deg',Math.PI/180],['rad',1],['grad',Math.PI/200],['turn',2*Math.PI]]],
power:['전력','Power',[['W',1],['kW',1000],['MW',1e6],['hp',745.699871582]]]};
function convert(v,a,b,cat){if(cat==='temp'){const c=a[0]==='°F'?(v-32)*5/9:a[0]==='K'?v-273.15:v;if(c < -273.15-1e-9)throw Error('absolute');return b[0]==='°F'?c*9/5+32:b[0]==='K'?c+273.15:c}return v*a[1]/b[1]}
function fmt(v){return Number.isFinite(v)?String(Number(v.toPrecision(12))):'—'}
// UI
const $=id=>document.getElementById(id);let prefs={};try{prefs=JSON.parse(localStorage.getItem('unitkit')||'{}')}catch{}let lang=prefs.lang==='en'?'en':prefs.lang==='ko'?'ko':navigator.language.startsWith('ko')?'ko':'en',cat=data[prefs.cat]?prefs.cat:'length',dark=!!prefs.dark,choices=prefs.choices||{},last='';
function save(){try{localStorage.setItem('unitkit',JSON.stringify({lang,cat,dark,choices}))}catch{}}
function update(){const u=data[cat][2],a=u[+$('from').value],b=u[+$('to').value],raw=$('amount').value.trim();choices[cat]=[+$('from').value,+$('to').value];save();$('all').replaceChildren();last='';try{if(!/^[-+]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[-+]?\d+)?$/i.test(raw)||!Number.isFinite(Number(raw)))throw Error('input');last=fmt(convert(Number(raw),a,b,cat));$('result').textContent=last+' '+b[0];$('status').textContent='';for(const x of u){const row=document.createElement('div');row.className='line';const n=document.createElement('span'),r=document.createElement('b');n.textContent=x[0];r.textContent=fmt(convert(Number(raw),a,x,cat));row.append(n,r);$('all').append(row)}}catch(e){$('result').textContent='—';$('status').textContent=e.message==='absolute'?(lang==='ko'?'절대영도보다 낮을 수 없습니다.':'Below absolute zero.'):(lang==='ko'?'유효한 숫자를 입력하세요.':'Enter a valid number.')}}
function render(){const ko=lang==='ko';document.documentElement.lang=lang;document.body.classList.toggle('dark',dark);$('lang').textContent=ko?'EN':'한국어';$('fl').textContent=ko?'변환할 단위':'From';$('tl').textContent=ko?'결과 단위':'To';$('al').textContent=ko?'전체 단위 변환':'All conversions';$('copy').textContent=ko?'복사':'Copy';$('footer').textContent=ko?'오프라인 · 입력값을 전송하지 않음':'Offline · Your input stays on your device';$('cats').replaceChildren();for(const [k,d] of Object.entries(data)){const b=document.createElement('button');b.textContent=d[ko?0:1];b.className=k===cat?'active':'';b.onclick=()=>{cat=k;render()};$('cats').append(b)}const u=data[cat][2];for(const id of ['from','to']){$(id).replaceChildren();u.forEach((x,i)=>{const o=document.createElement('option');o.value=i;o.textContent=x[0];$(id).append(o)})}const c=choices[cat]||[0,1];$('from').selectedIndex=u[c[0]]?c[0]:0;$('to').selectedIndex=u[c[1]]?c[1]:1;update()}
$('from').onchange=$('to').onchange=$('amount').oninput=update;$('lang').onclick=()=>{lang=lang==='ko'?'en':'ko';render()};$('theme').onclick=()=>{dark=!dark;render()};$('swap').onclick=()=>{const a=$('from').value;$('from').value=$('to').value;$('to').value=a;update()};$('copy').onclick=async()=>{if(!last)return;try{await navigator.clipboard.writeText(last);$('status').textContent=lang==='ko'?'복사 완료':'Copied'}catch{$('status').textContent=lang==='ko'?'길게 눌러 복사하세요':'Long press to copy'}};render();
</script></html>
