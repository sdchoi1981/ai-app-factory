name: Test apps
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'templates/**'
      - 'dashboard/**'
      - '.github/workflows/test-apps.yml'
      - '.github/workflows/validate-apps.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - 'templates/**'
      - 'dashboard/**'
      - '.github/workflows/test-apps.yml'
      - '.github/workflows/validate-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: App ID or all
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: app-test-${{ github.ref }}-${{ inputs.app || 'all' }}
  cancel-in-progress: true
jobs:
  select:
    uses: ./.github/workflows/validate-apps.yml
    with:
      app: ${{ inputs.app || 'all' }}
  test:
    name: ${{ matrix.appName }} tests
    needs: select
    if: needs.select.outputs.has-apps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run each app's tests
        env:
          APP_ID: ${{ matrix.appId }}
        run: |
          set -euo pipefail
          node scripts/test-app.mjs "$APP_ID" 2>&1 | tee test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.appId }}-${{ matrix.appName }}-${{ matrix.versionName }}-test-results
          path: test-results.log
          if-no-files-found: ignore
          retention-days: 7
  factory:
    name: Factory, shared packages and dashboard
    needs: select
    if: needs.select.outputs.run-factory-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test factory integration and shared modules
        run: |
          set -euo pipefail
          node --test packages/test.mjs scripts/test-factory.mjs dashboard/build.test.mjs 2>&1 | tee factory-test-results.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: factory-integration-test-results
          path: factory-test-results.log
          if-no-files-found: ignore
          retention-days: 7
