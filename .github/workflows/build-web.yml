name: Build web apps
on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/validate-apps.yml'
  push:
    branches: [main, 'codex/**']
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/**'
      - '.github/workflows/build-web.yml'
      - '.github/workflows/validate-apps.yml'
  workflow_dispatch:
    inputs:
      app:
        description: Web app ID or all
        default: all
        type: string
permissions:
  contents: read
concurrency:
  group: web-build-${{ github.ref }}-${{ inputs.app || 'all' }}
  cancel-in-progress: true
jobs:
  select:
    uses: ./.github/workflows/validate-apps.yml
    with:
      platform: web
      app: ${{ inputs.app || 'all' }}
  build:
    name: ${{ matrix.appName }} web
    needs: select
    if: needs.select.outputs.has-apps == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        env:
          APP_ID: ${{ matrix.appId }}
        run: |
          set -euo pipefail
          node scripts/build-app.mjs "$APP_ID" 2>&1 | tee build-web.log
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.appId }}-${{ matrix.appName }}-${{ matrix.versionName }}-web
          path: ${{ matrix.path }}/dist/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.appId }}-${{ matrix.appName }}-${{ matrix.versionName }}-web-logs
          path: build-web.log
          if-no-files-found: ignore
          retention-days: 7
