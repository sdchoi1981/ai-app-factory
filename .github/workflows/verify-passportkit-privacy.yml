name: Verify PassportKit APK privacy
on:
  pull_request:
    branches: [main]
    paths: ['apps/passportkit/**', '.github/workflows/verify-passportkit-privacy.yml', 'packages/core/**', 'packages/ui/**']
  push:
    branches: [main]
    paths: ['apps/passportkit/**', '.github/workflows/verify-passportkit-privacy.yml', 'packages/core/**', 'packages/ui/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify manifest permissions
        working-directory: apps/passportkit
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=4 :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/passportkit-permissions.txt"
          if grep -E "uses-permission.*(android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_IMAGES|READ_MEDIA_VISUAL_USER_SELECTED|READ_EXTERNAL_STORAGE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)|com.google.android.gms.permission.AD_ID)" "$RUNNER_TEMP/passportkit-permissions.txt"; then
            echo "Unexpected sensitive permission"; exit 1
          fi
          # The Android 8–9 JPG export may request storage access. The APK must
          # never declare it for newer Android versions or declare it twice.
          permissions="$RUNNER_TEMP/passportkit-permissions.txt"
          legacy_writes=$(awk "/^uses-permission[^:]*: name='android[.]permission[.]WRITE_EXTERNAL_STORAGE'/ { count++ } END { print count+0 }" "$permissions")
          if [[ "$legacy_writes" != 1 ]] ||
             ! grep -Fxq "uses-permission: name='android.permission.WRITE_EXTERNAL_STORAGE' maxSdkVersion='28'" "$permissions"; then
            echo "Expected exactly one WRITE_EXTERNAL_STORAGE declaration capped at API 28"; exit 1
          fi
      - name: Verify 16 KB alignment in the release build
        working-directory: apps/passportkit
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=4 :app:assembleRelease :app:bundleRelease
          release_apk=app/build/outputs/apk/release/app-release-unsigned.apk
          release_aab=app/build/outputs/bundle/release/app-release.aab
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 "$release_apk"
          python3 - "$release_aab" <<'PYTHON'
          from pathlib import Path, PurePosixPath
          from subprocess import check_output
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import sys

          with ZipFile(sys.argv[1]) as bundle, TemporaryDirectory() as temporary:
              library = Path(temporary) / "library.so"
              for name in bundle.namelist():
                  entry = PurePosixPath(name)
                  if entry.suffix != ".so" or entry.parent.name not in {"arm64-v8a", "x86_64"}:
                      continue
                  library.write_bytes(bundle.read(name))
                  headers = check_output(["readelf", "-lW", str(library)], text=True)
                  alignments = [
                      int(fields[-1], 16)
                      for line in headers.splitlines()
                      if (fields := line.split()) and fields[0] == "LOAD"
                  ]
                  if not alignments or min(alignments) < 16384:
                      raise SystemExit(f"{name}: ELF LOAD alignment below 16 KB")
                  print(f"{name}: ELF LOAD segments aligned to at least 16 KB")
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: passportkit-PRIVACY-VERIFIED-APK
          path: apps/passportkit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
