name: Verify PassportKit APK privacy
on:
  pull_request:
    branches: [main]
    paths: ['apps/passportkit/**', '.github/workflows/verify-passportkit-privacy.yml', 'packages/core/**', 'packages/ui/**']
  push:
    branches: [main]
    paths: ['apps/passportkit/**', '.github/workflows/verify-passportkit-privacy.yml', 'packages/core/**', 'packages/ui/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: true
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: 'false'
      - name: Build and verify manifest permissions
        working-directory: apps/passportkit
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=4 :app:assembleDebug
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions "$apk" | tee "$RUNNER_TEMP/passportkit-permissions.txt"
          if grep -E "uses-permission.*(android.permission.(INTERNET|ACCESS_NETWORK_STATE|READ_MEDIA_IMAGES|READ_MEDIA_VISUAL_USER_SELECTED|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|ACCESS_FINE_LOCATION|ACCESS_COARSE_LOCATION)|com.google.android.gms.permission.AD_ID)" "$RUNNER_TEMP/passportkit-permissions.txt"; then
            echo "Unexpected sensitive permission"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: passportkit-PRIVACY-VERIFIED-APK
          path: apps/passportkit/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
